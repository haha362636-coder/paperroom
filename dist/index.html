<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸间 · 黑色灵感工作台</title><link rel="stylesheet" href="style.css?v=10"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head><body>
<header><a class="brand" href="./" aria-label="纸间"><span class="logo">p.</span></a><div class="board-switcher"><select id="board-select" aria-label="切换白板"></select><button id="new-board" class="icon-button" title="新建白板" aria-label="新建白板">＋</button></div><div class="header-actions"><span id="save-indicator" data-state="saved" title="已保存到本机" aria-label="自动保存状态"></span><span id="save-status" class="sr-only" role="status">已保存到本机</span><button id="library-toggle" class="icon-button" title="全部笔记" aria-label="全部笔记">☷</button><button id="backup" class="icon-button" title="导出备份" aria-label="导出备份">↗</button></div></header>
<div id="lanyard" tabindex="0" role="button" aria-label="挂绳工牌，拖动或按方向键甩动" title="拖动工牌，松手回摆"></div><main><div id="viewport" aria-label="3D 笔记工作台"></div><div id="error" hidden>3D 加载失败，请使用支持 WebGL 的浏览器。</div>
<aside id="library" hidden><div class="panel-heading"><span>笔记</span><span id="count"></span></div><div id="folders"></div><div id="notes"></div><div id="tapes" hidden></div></aside>
<nav class="creation-dock" aria-label="创作工具"><button id="new-note" title="新建笔记 · N" aria-label="新建笔记">＋</button><button id="new-folder" title="新建文件夹" aria-label="创建文件夹">▱</button><span></span><button id="new-drawing" title="画一张简笔画" aria-label="简笔画">✎</button><button id="new-sticker" title="制作贴纸" aria-label="制作贴纸">✦</button><button id="new-tape" class="tape-tool" title="录一盘磁带 · R" aria-label="录音磁带"><svg viewBox="0 0 32 22" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="19" rx="2.5"/><rect x="7" y="6" width="18" height="6.5" rx="3.25"/><circle cx="11" cy="9.25" r="1.6"/><circle cx="21" cy="9.25" r="1.6"/><path d="M8 20.5l2.2-4.5h11.6l2.2 4.5"/></svg></button></nav>
<div class="viewbar"><button id="front" class="selected" title="正面" aria-label="正面视角">▣</button><button id="angle" title="立体" aria-label="立体视角">◇</button><span></span><button id="wind" aria-pressed="true" title="微风" aria-label="微风">≈</button><button id="sound" aria-pressed="true" title="声音" aria-label="声音">♫</button><button id="demo" title="体验吸附" aria-label="体验吸附">↘</button></div><div id="drop-hint" hidden>↓</div>
<div id="tape-bar" hidden role="region" aria-label="磁带播放器"><button id="tape-rewind" class="icon-button" aria-label="倒带到开头" title="倒带">«</button><button id="tape-play" class="icon-button play" aria-label="播放">▶</button><span id="tape-bar-title"></span><input id="tape-seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="tape-bar-time">00:00 / 00:00</span><button id="tape-edit" class="icon-button" aria-label="编辑磁带标签" title="标签与外壳">✎</button><button id="tape-eject" class="icon-button" aria-label="关闭播放器" title="停止">×</button></div>
<div id="float-bar" hidden><button id="close-float" class="icon-button" aria-label="收起文件夹" title="收起">×</button><span id="float-title"></span><button id="float-prev" class="icon-button" aria-label="上一组">‹</button><span id="float-page"></span><button id="float-next" class="icon-button" aria-label="下一组">›</button><button id="float-add" class="icon-button" aria-label="在文件夹中新建笔记" title="新建笔记">＋</button><button id="float-sticker" class="icon-button" aria-label="给文件夹制作贴纸" title="贴上自己的贴纸">✦</button><button id="delete-folder" class="icon-button" aria-label="移除文件夹并保留笔记" title="移除文件夹，保留笔记">−</button></div>
<div id="float-items" class="sr-only" aria-label="悬浮笔记"></div></main>
<dialog id="editor"><form id="note-form"><div class="dialog-head"><span id="editor-label">写一张便签</span><small id="editor-status" role="status">输入即自动保存</small><button type="button" data-close="editor" aria-label="关闭">×</button></div><input id="note-title" placeholder="给灵感一个名字" maxlength="80" aria-label="笔记标题"><textarea id="note-body" placeholder="从一个念头开始……" maxlength="10000" aria-label="笔记内容"></textarea><div id="drawing-wrap" hidden><canvas id="drawing" width="720" height="480" aria-label="简笔画画布"></canvas><button type="button" id="clear-drawing">清空画布</button></div><div class="form-row"><label>纸张 <input type="color" id="note-color" value="#eeeef0"></label><label>收纳到 <select id="note-folder"><option value="">白板</option></select></label></div><div id="note-meta" aria-live="off"></div><div class="dialog-actions"><div><button type="button" id="delete-note">删除</button><button type="button" id="take-note">取回白板</button></div><button class="primary" type="submit">贴上去 ↗</button></div></form></dialog>
<dialog id="board-dialog"><form id="board-form"><div class="dialog-head"><span>新建白板</span><button type="button" data-close="board-dialog" aria-label="关闭">×</button></div><input id="board-name" maxlength="40" placeholder="给白板起个名字" aria-label="白板名称" required><button class="primary" type="submit">创建白板</button></form></dialog><dialog id="name-dialog"><form id="folder-form"><div class="dialog-head"><span>创建皮质文件夹</span><button type="button" data-close="name-dialog">×</button></div><input id="folder-name" placeholder="例如：正在酝酿的计划" maxlength="40" required aria-label="文件夹名称"><button class="primary" type="submit">放上白板</button></form></dialog>
<dialog id="sticker-dialog"><form id="sticker-form"><div class="dialog-head"><span>自己的贴纸</span><button type="button" data-close="sticker-dialog" aria-label="关闭">×</button></div><div class="sticker-stage"><canvas id="sticker-canvas" width="512" height="512" aria-label="贴纸绘制画布"></canvas></div><div class="sticker-tools"><input id="sticker-ink" type="color" value="#16171b" aria-label="画笔颜色"><input id="sticker-size" type="range" min="2" max="28" value="9" aria-label="画笔粗细"><button type="button" id="sticker-undo" title="撤销" aria-label="撤销笔画">↶</button><button type="button" id="sticker-clear" title="清空" aria-label="清空画布">×</button><label class="upload-button" title="使用图片">↑<input id="sticker-upload" type="file" accept="image/png,image/jpeg,image/webp" aria-label="上传贴纸图片"></label></div><div class="form-row"><label>贴在哪里 <select id="sticker-target"></select></label><button id="delete-sticker" type="button">移除</button></div><button type="submit" class="primary">贴上去 ↗</button></form></dialog>
<dialog id="tape-dialog"><form id="tape-form"><div class="dialog-head"><span id="tape-heading">录一盘磁带</span><button type="button" data-close="tape-dialog" aria-label="关闭">×</button></div>
<div class="recorder"><div id="tape-deck" class="mini-cassette" aria-hidden="true"><div class="mc-label"><b>A</b><span id="tape-label-preview"></span></div><div class="mc-window"><i class="mc-pack l"></i><i class="mc-pack r"></i><i class="mc-reel l"></i><i class="mc-reel r"></i></div><div class="mc-trap"><i></i><i></i></div><i class="mc-screw a"></i><i class="mc-screw b"></i><i class="mc-screw c"></i><i class="mc-screw d"></i><i class="mc-screw e"></i></div><canvas id="vu-meter" width="300" height="130" aria-hidden="true"></canvas></div>
<div id="tape-time" role="status"></div><div class="tape-controls"><button type="button" id="tape-record" class="rec-button">录音</button><button type="button" id="tape-stop" class="rec-button stop" hidden>停止</button><button type="button" id="tape-preview" class="icon-button" aria-label="试听">▶</button></div>
<input id="tape-title" maxlength="40" placeholder="写在标签上的名字" aria-label="磁带标签"><div class="form-row"><span class="shell-row">外壳 <span id="tape-shells" role="radiogroup" aria-label="外壳颜色"></span></span><button id="delete-tape" type="button">移除</button></div><button type="submit" id="tape-save" class="primary">贴上去 ↗</button></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js?v=11"></script></body></html>
